<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="交易组机会与异动分析。">
  <title>交易组 · 汇总看板</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/trade.css">
  <script src="assets/trade.js" defer></script>
</head>
<body class="trade-desk" id="top" data-theme-hint="dark">
  <a class="skip-link" href="#desk-main">跳至交易组看板</a>
  <header class="topbar">
    <div class="topbar-heading">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">组</span>
        <div>
          <h1>交易组 <span>· 汇总看板</span></h1>
          <p>数据来自交易组落盘，只读静态</p>
        </div>
      </div>
      <nav class="page-nav" aria-label="站点导航">
        <a href="index.html" class="page-nav-link">信息监测台</a>
        <a href="trade.html" class="page-nav-link is-active" aria-current="page">交易组</a>
      <a href="bot-office/" class="page-nav-link">小办公室</a><a href="bot-auto-panel/" class="page-nav-link">自动化面板</a><a href="bot-auto-panel/#/hud" class="page-nav-link">量化主界面</a></nav>
      <div class="appearance-controls">
        <label class="theme-control"><span class="sr-only">页面主题</span>
          <select id="theme-select" aria-label="页面主题">
            <option value="dark">深色</option>
            <option value="system">跟随系统</option>
            <option value="light">浅色</option>
          </select>
        </label>
      </div>
    </div>
    <div class="topbar-tools desk-tools">
      <p class="updated"><span id="status-dot" class="status-dot" aria-hidden="true"></span>数据截至 <time id="desk-asof">—</time><span class="timezone">北京时间</span></p>
    </div>
  </header>

  <main class="desk-main" id="desk-main" tabindex="-1">
    <section class="analysis-card" aria-labelledby="opp-heading"><h2 id="opp-heading">机会分析</h2><div id="opp-panel" aria-live="polite">正在读取机会报告…</div></section>
    <section class="analysis-card" aria-labelledby="anomaly-heading"><h2 id="anomaly-heading">异动分析</h2><div id="anomaly-panel" aria-live="polite">正在读取异动报告…</div></section>
    <noscript>请启用脚本以查看分析报告。</noscript>
  </main>

  <footer class="footer">
    <p>仅供分析与计划，不执行交易。</p>
    <a href="#top">回到顶部 ↑</a>
  </footer>
</body>
</html>
