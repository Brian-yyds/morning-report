<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="币安合约急涨急跌、GMGN 热度与成交额监测台。">
  <title>市场监控 · 每日早报</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/monitor.css">
  <script src="assets/monitor.js" defer></script>
</head>
<body class="monitor-page" id="top">
  <a class="skip-link" href="#monitor-main">跳至监控内容</a>
  <header class="topbar" id="topbar">
    <div class="topbar-heading">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">市</span>
        <div>
          <h1>市场监控</h1>
          <p>币安合约 · GMGN · 成交额</p>
        </div>
      </div>
      <nav class="page-nav" aria-label="站点导航">
        <a href="index.html" class="page-nav-link">信息监测台</a>
        <a href="monitor.html" class="page-nav-link is-active" aria-current="page">市场监控</a>
      </nav>
      <div class="appearance-controls">
        <label class="theme-control"><span class="sr-only">页面主题</span>
          <select id="theme-select" aria-label="页面主题">
            <option value="system">跟随系统</option>
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select>
        </label>
        <button type="button" id="refresh-btn" class="text-button" title="立即刷新">刷新</button>
      </div>
    </div>
    <div class="topbar-tools monitor-tools">
      <p class="updated"><span class="status-dot" id="live-dot" aria-hidden="true"></span>更新于 <time id="last-updated">—</time><span class="timezone">北京时间</span></p>
      <div class="health-strip" id="health-strip" aria-label="数据源状态"></div>
      <p class="refresh-note muted" id="refresh-note" hidden></p>
    </div>
  </header>

  <main class="monitor-main" id="monitor-main" tabindex="-1">
    <div id="stale-banner" class="stale-banner" role="status" hidden></div>
    <section class="focus-strip" aria-labelledby="focus-heading">
      <div class="section-head"><h2 id="focus-heading">自选聚焦</h2><span class="muted" id="focus-meta">—</span></div>
      <div id="focus-cards" class="focus-cards"></div>
    </section>

    <section class="alerts-grid" aria-label="警报">
      <div class="panel alert-panel">
        <div class="section-head"><h2>急涨急跌</h2><span class="muted" id="spike-count">0</span></div>
        <div id="spike-list" class="alert-list"></div>
      </div>
      <div class="panel alert-panel">
        <div class="section-head"><h2>GMGN 警报</h2><span class="muted" id="gmgn-alert-count">0</span></div>
        <div id="gmgn-alert-list" class="alert-list"></div>
      </div>
    </section>

    <section class="panel rankings-panel" aria-labelledby="rank-heading">
      <div class="section-head">
        <h2 id="rank-heading">市场排行</h2>
        <div class="segmented" id="rank-tabs" role="tablist" aria-label="排行类型">
          <button type="button" role="tab" data-rank="up" aria-selected="true">涨幅</button>
          <button type="button" role="tab" data-rank="down" aria-selected="false">跌幅</button>
          <button type="button" role="tab" data-rank="oi_up" aria-selected="false">OI 增</button>
          <button type="button" role="tab" data-rank="oi_down" aria-selected="false">OI 减</button>
        </div>
      </div>
      <div id="rank-table" class="rank-table" role="tabpanel"></div>
    </section>

    <section class="panel" aria-labelledby="gmgn-heading">
      <div class="section-head"><h2 id="gmgn-heading">GMGN 热度</h2><span class="muted" id="gmgn-meta">—</span></div>
      <div id="gmgn-leaders" class="gmgn-grid"></div>
    </section>

    <section class="panel" aria-labelledby="volume-heading">
      <div class="section-head"><h2 id="volume-heading">成交额概览</h2><span class="muted" id="volume-meta">—</span></div>
      <div id="volume-days" class="volume-days"></div>
    </section>
  </main>

  <footer class="footer">
    <p>市场监控数据由采集端定时上传，页面每 60 秒自动刷新（标签页可见时）。不含账户或密钥信息。</p>
    <a href="#top">回到顶部 ↑</a>
  </footer>
</body>
</html>
